# Render Blueprint: one web service (interface + API) and one Postgres database.
# Create it from the Render dashboard: New > Blueprint > pick this repository.
services:
  - type: web
    name: formextract
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: formextract-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false            # asked for when the Blueprint is created
      - key: GROQ_API_KEY
        sync: false
      - key: USER_PASSWORD
        generateValue: true    # read it in the dashboard under Environment
      - key: DEVELOPER_PASSWORD
        generateValue: true
      - key: STORAGE_DIR
        value: /app/data/storage   # the free plan's disk is erased on every deploy and restart: images do not last

databases:
  - name: formextract-db
    plan: free
